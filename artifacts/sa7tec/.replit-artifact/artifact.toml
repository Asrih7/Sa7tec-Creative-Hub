kind = "web"
previewPath = "/"
title = "SA7TEC"
version = "1.0.0"
id = "artifacts/sa7tec"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21050

[services.development]
run = "pnpm --filter @workspace/sa7tec run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sa7tec", "run", "build" ]
publicDir = "artifacts/sa7tec/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21050"
BASE_PATH = "/"
